apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: identity-poc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporting-worker
  namespace: identity-poc
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: identity-poc-token-reviewer
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: identity-poc-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: identity-poc-token-reviewer
subjects:
  - kind: ServiceAccount
    name: api
    namespace: identity-poc
