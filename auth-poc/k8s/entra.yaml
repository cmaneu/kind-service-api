apiVersion: apps/v1
kind: Deployment
metadata:
  name: entra-local
  namespace: identity-poc
spec:
  replicas: 1
  selector:
    matchLabels: { app: entra-local }
  template:
    metadata:
      labels: { app: entra-local }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: entra-local
          image: ghcr.io/cmaneu/entra-local:latest
          ports:
            - containerPort: 8443
          env:
            - name: PUBLIC_ORIGIN
              value: https://entra-local.identity-poc.svc.cluster.local:8443
            - name: ISSUER
              value: https://localhost:8443/11111111-1111-1111-1111-111111111111/v2.0
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            tcpSocket: { port: 8443 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: entra-local
  namespace: identity-poc
spec:
  type: NodePort
  selector: { app: entra-local }
  ports:
    - port: 8443
      targetPort: 8443
      nodePort: 30443
