apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: identity-poc
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      serviceAccountName: api
      containers:
        - name: api
          image: identity-poc-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: ENTRA_ISSUER
              value: https://localhost:8443/11111111-1111-1111-1111-111111111111/v2.0
            - name: ENTRA_AUDIENCE
              value: cccccccc-0000-0000-0000-000000000007
            - name: ENTRA_JWKS_URL
              value: https://entra-local.identity-poc.svc.cluster.local:8443/11111111-1111-1111-1111-111111111111/discovery/v2.0/keys
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/entra/ca.pem
          volumeMounts:
            - name: entra-ca
              mountPath: /etc/entra
              readOnly: true
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: entra-ca
          configMap:
            name: entra-ca
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: identity-poc
spec:
  type: NodePort
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-worker
  namespace: identity-poc
spec:
  replicas: 1
  selector:
    matchLabels: { app: reporting-worker }
  template:
    metadata:
      labels: { app: reporting-worker }
    spec:
      serviceAccountName: reporting-worker
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: identity-poc-worker:local
          imagePullPolicy: Never
          env:
            - name: API_URL
              value: http://api.identity-poc.svc.cluster.local:3000
          volumeMounts:
            - name: api-token
              mountPath: /var/run/api-token
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: urn:identity-poc:api
                  expirationSeconds: 3600
